<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Dark Fiber Core Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d0f'/%3E%3Cpath d='M7 10h18M7 16h13M7 22h18' stroke='%23e3a94f' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-unplug" viewBox="0 0 24 24"><path d="m19 5 3-3"/><path d="m2 22 3-3"/><path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"/><path d="M7.5 13.5 10 11"/><path d="M10.5 16.5 13 14"/><path d="m12 6 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
</svg>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#/overview" aria-label="Dark Fiber Core Manager">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M6 10h20M6 16h14M6 22h20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Dark Fiber</span>
        <span class="brand-sub">Core manager</span>
      </span>
    </a>
    <nav class="nav" aria-label="Navigasi utama">
      <p class="nav-label">Workspace</p>
      <a href="#/overview" class="nav-item" data-nav="overview"><svg class="ico"><use href="#i-grid"/></svg><span>Ringkasan</span></a>
      <a href="#/cables" class="nav-item" data-nav="cables"><svg class="ico"><use href="#i-route"/></svg><span>Kabel backbone</span></a>
      <a href="#/otb" class="nav-item" data-nav="otb"><svg class="ico"><use href="#i-layers"/></svg><span>Peta OTB</span></a>
      <a href="#/tenants" class="nav-item" data-nav="tenants"><svg class="ico"><use href="#i-users"/></svg><span>Tenant</span></a>
      <a href="#/leases" class="nav-item" data-nav="leases"><svg class="ico"><use href="#i-file"/></svg><span>Lease</span></a>
    </nav>
    <div class="side-foot">
      <div class="side-gauge">
        <div class="side-gauge-top"><span>Kapasitas core</span><span class="mono" id="side-pct">–</span></div>
        <div class="meter"><span id="side-fill" style="width:0%"></span></div>
        <p class="side-gauge-note"><span class="mono" id="side-count">–</span> dari <span class="mono" id="side-total">–</span> core terpakai</p>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="page-title">Ringkasan jaringan</h1>
        <p id="page-sub">Kapasitas dan utilisasi core backbone</p>
      </div>
      <div class="topbar-actions">
        <div class="search-box" id="search-box">
          <label class="search" id="search-wrap">
            <svg class="ico"><use href="#i-search"/></svg>
            <input id="search" type="search" placeholder="Cari kabel, tenant, lease, port OTB" autocomplete="off" aria-label="Cari" role="combobox" aria-expanded="false" aria-controls="search-pop">
            <span class="search-kbd" title="Tekan / untuk fokus">/</span>
          </label>
          <div id="search-pop" class="search-pop" hidden></div>
        </div>
        <span id="primary-slot"></span>
      </div>
    </header>
    <div id="view" class="view" aria-live="polite"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
